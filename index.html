<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Terminal</title>
  <link rel="stylesheet" href="/static/xterm.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; height: 100dvh; background: #1e1e1e; color: #ddd; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; overscroll-behavior: none; }
    body { display: flex; flex-direction: column; }
    #toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #2d2d2d; border-bottom: 1px solid #444; font-size: 13px; }
    #tabs { display: flex; gap: 4px; align-items: center; flex: 1; overflow-x: auto; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; touch-action: pan-x; padding: 0 4px; }
    #tabs::-webkit-scrollbar { height: 4px; }
    #tabs::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }
    .tab { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #3c3c3c; border-radius: 4px; cursor: pointer; white-space: nowrap; user-select: none; border: 1px solid transparent; min-height: 36px; flex-shrink: 0; }
    .tab.active { background: #0e639c; color: #fff; border-color: #1177bb; }
    .tab .title { font-family: monospace; font-size: 12px; line-height: 1; white-space: nowrap; min-width: 24px; outline: none; cursor: text; }
    .tab .title.editing { background: #1e1e1e; color: #d4d4d4; border: 1px solid #1177bb; border-radius: 3px; padding: 1px 4px; }
    .tab .close { display: flex; align-items: center; justify-content: center; font-weight: bold; padding: 0 4px; margin-left: 2px; cursor: pointer; border-radius: 3px; font-size: 14px; min-width: 24px; min-height: 24px; }
    .tab .close:hover { background: #c75450; color: #fff; }
    .tab-add { display: flex; align-items: center; justify-content: center; padding: 6px 10px; background: #2d2d2d; border: 1px solid #555; border-radius: 4px; color: #9cdcfe; cursor: pointer; font-size: 16px; line-height: 1; user-select: none; min-width: 36px; min-height: 36px; }
    .tab-add:hover { background: #3c3c3c; border-color: #9cdcfe; color: #fff; }
    .toolbar-right { margin-left: auto; display: flex; gap: 6px; flex: 0 0 auto; }
    .toolbar-btn { padding: 6px 12px; border: none; border-radius: 4px; background: #3c3c3c; color: #ddd; cursor: pointer; font-size: 13px; min-height: 36px; white-space: nowrap; flex-shrink: 0; }
    .toolbar-btn:hover { background: #4c4c4c; }
    .toolbar-btn:disabled { background: #555; color: #999; cursor: not-allowed; }
    #terminal-area { flex: 1; position: relative; overflow: hidden; }
    .empty-state { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; z-index: 5; }
    .empty-state.visible { display: flex; }
    .empty-state button { font-size: 16px; padding: 10px 20px; }
    .term-container { position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px; visibility: hidden; z-index: 0; }
    .term-container.active { visibility: visible; z-index: 1; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: #2d2d2d; border: 1px solid #555; border-radius: 6px; padding: 20px; min-width: 340px; max-width: 90vw; max-height: 85vh; overflow-y: auto; color: #ddd; }
    .modal-content h3 { margin: 0 0 16px; font-size: 16px; }
    .modal-content .section { margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #444; }
    .modal-content .section-title { font-size: 12px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .modal-content label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
    .modal-content input[type="text"], .modal-content input[type="number"], .modal-content select { background: #1e1e1e; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 4px; width: 160px; }
    .modal-content input[type="color"] { background: transparent; border: none; width: 60px; height: 24px; cursor: pointer; }
    .modal-content input[type="checkbox"] { width: auto; cursor: pointer; }
    .modal-content .hint { font-size: 11px; color: #999; margin-top: 4px; text-align: right; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .modal-actions button { padding: 6px 12px; border: none; border-radius: 4px; background: #0e639c; color: #fff; cursor: pointer; font-size: 13px; }
    .modal-actions button:hover { background: #1177bb; }
    .modal-actions .secondary { background: #555; }
    .modal-actions .secondary:hover { background: #666; }

    #shortcut-bar { display: none; box-sizing: border-box; width: 100%; gap: 4px; padding: 4px 6px; background: #2d2d2d; border-top: 1px solid #444; overflow-x: auto; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; touch-action: pan-x; flex-shrink: 0; align-items: center; }
    body.mobile #shortcut-bar { display: flex; }
    #shortcut-bar button { padding: 4px 8px; font-size: 12px; background: #3c3c3c; color: #ddd; border: 1px solid #555; border-radius: 4px; white-space: nowrap; min-height: 30px; cursor: pointer; touch-action: pan-x; -webkit-tap-highlight-color: transparent; }

    .xterm .xterm-viewport, .xterm .xterm-screen, .xterm .xterm-screen canvas { touch-action: pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
    body.mobile .xterm .xterm-viewport::-webkit-scrollbar { width: 10px; }
    body.mobile .xterm .xterm-viewport::-webkit-scrollbar-thumb { background: #555; border-radius: 5px; }
    #shortcut-bar button:active, #shortcut-bar button.active { background: #0e639c; border-color: #1177bb; color: #fff; }

    .tab, .tab-add, .toolbar-btn, #shortcut-bar button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

    body.mobile .tab { padding: 5px 8px; min-height: 32px; flex-shrink: 0; }
    body.mobile .tab .title { font-size: 12px; }
    body.mobile .tab .close { padding: 0 3px; font-size: 13px; min-width: 20px; min-height: 20px; }
    body.mobile .tab-add { padding: 5px 8px; min-width: 32px; min-height: 32px; }
    body.mobile .toolbar-btn { padding: 5px 8px; font-size: 12px; min-height: 32px; white-space: nowrap; flex-shrink: 0; }
    body.mobile #toolbar { padding: 4px 6px; gap: 4px; }
    body.mobile .toolbar-right { flex: 0 0 auto; }

    @media (max-width: 640px) {
      #toolbar { padding: 4px 6px; gap: 4px; }
      #tabs { flex: 1 1 auto; min-width: 0; }
      .toolbar-right { margin-left: auto; gap: 4px; flex: 0 0 auto; }
      .toolbar-btn { padding: 5px 8px; font-size: 12px; min-height: 32px; white-space: nowrap; flex-shrink: 0; }
      .tab { padding: 5px 8px; min-height: 32px; flex-shrink: 0; }
      .tab .title { font-size: 12px; }
      .tab .close { padding: 0 3px; font-size: 13px; min-width: 20px; min-height: 20px; }
      .tab-add { padding: 5px 8px; min-width: 32px; min-height: 32px; }
      .modal-content { min-width: unset; width: 95vw; max-height: 80dvh; padding: 16px; }
      .modal-content h3 { font-size: 16px; }
      .modal-content label { flex-direction: column; align-items: stretch; gap: 4px; }
      .modal-content input[type="text"], .modal-content input[type="number"], .modal-content select { width: 100%; }
      .modal-actions { justify-content: space-between; gap: 8px; }
      .modal-actions button { flex: 1; padding: 8px; font-size: 13px; }
      .term-container { top: 4px; left: 4px; right: 4px; bottom: 4px; }
      .empty-state button { font-size: 16px; padding: 12px 24px; }
    }
  </style>
</head>
<body>
  <script>if (window.matchMedia('(pointer: coarse)').matches) document.body.classList.add('mobile');</script>
  <div id="toolbar">
    <div id="tabs"></div>
    <div class="toolbar-right">
      <button id="close-all-btn" class="toolbar-btn" onclick="closeAllTabs()" data-i18n="closeAll">关闭所有</button>
      <button id="settings-btn" class="toolbar-btn" onclick="openSettings()" data-i18n="settings">设置</button>
    </div>
  </div>
  <div id="terminal-area">
    <div id="empty-state" class="empty-state">
      <button class="toolbar-btn" onclick="newTerminal()" data-i18n="newTerminal">新建终端</button>
    </div>
  </div>

  <div id="shortcut-bar"></div>

  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <h3 data-i18n="terminalSettings">终端设置</h3>

      <div class="section">
        <div class="section-title" data-i18n="general">常规</div>
        <label><span data-i18n="language">语言</span>
          <select id="setting-language">
            <option value="zh">简体中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>

      <div class="section">
        <div class="section-title" data-i18n="theme">主题</div>
        <label><span data-i18n="themePreset">主题预设</span>
          <select id="setting-theme"></select>
        </label>
        <label class="color-row"><span data-i18n="background">背景色</span> <input id="setting-bg" type="color"></label>
        <label class="color-row"><span data-i18n="foreground">前景色</span> <input id="setting-fg" type="color"></label>
        <label class="color-row"><span data-i18n="cursor">光标颜色</span> <input id="setting-cursor" type="color"></label>
        <label><span data-i18n="cursorBlink">光标闪烁</span> <input id="setting-cursor-blink" type="checkbox"></label>
        <label><span data-i18n="cursorStyle">光标样式</span>
          <select id="setting-cursor-style"></select>
        </label>
      </div>

      <div class="section">
        <div class="section-title" data-i18n="font">字体</div>
        <label><span data-i18n="fontSize">字体大小</span> <input id="setting-font-size" type="number" min="8" max="64"></label>
        <label><span data-i18n="fontFamily">字体</span> <input id="setting-font-family" type="text"></label>
        <label><span data-i18n="fontWeight">字体粗细</span>
          <select id="setting-font-weight"></select>
        </label>
        <label><span data-i18n="lineHeight">行高</span> <input id="setting-line-height" type="number" min="0.5" max="3" step="0.1"></label>
        <label><span data-i18n="letterSpacing">字间距</span> <input id="setting-letter-spacing" type="number" min="-5" max="20" step="0.5"></label>
        <label><span data-i18n="tabWidth">Tab 宽度</span> <input id="setting-tab-width" type="number" min="1" max="32"></label>
        <label><span data-i18n="scrollback">滚动缓冲</span> <input id="setting-scrollback" type="number" min="0" max="100000" step="1000"></label>
      </div>

      <div class="section">
        <div class="section-title" data-i18n="input">输入</div>
        <label><span data-i18n="copyOnSelect">选中即复制</span> <input id="setting-copy-select" type="checkbox"></label>
        <label><span data-i18n="rightClickPaste">右键粘贴</span> <input id="setting-right-click-paste" type="checkbox"></label>
        <div class="hint" id="paste-hint" data-i18n="pasteHint">右键粘贴需要 HTTPS 或浏览器剪贴板权限</div>
      </div>

      <div class="section">
        <div class="section-title" data-i18n="connection">连接</div>
        <label><span data-i18n="autoReconnect">自动重连</span> <input id="setting-auto-reconnect" type="checkbox"></label>
        <label><span data-i18n="reconnectInterval">重连间隔 (ms)</span> <input id="setting-reconnect-interval" type="number" min="500" max="60000" step="500"></label>
        <label><span data-i18n="keepaliveInterval">保活间隔 (ms)</span> <input id="setting-keepalive-interval" type="number" min="0" max="300000" step="1000"></label>
      </div>

      <div class="section">
        <div class="section-title" data-i18n="session">新会话</div>
        <label><span data-i18n="sessionTerm">终端类型</span>
          <select id="setting-term">
            <option value="xterm-256color">xterm-256color</option>
            <option value="xterm-direct">xterm-direct</option>
            <option value="xterm">xterm</option>
            <option value="screen-256color">screen-256color</option>
            <option value="linux">linux</option>
          </select>
        </label>
        <label><span data-i18n="sessionColorterm">彩色模式</span>
          <select id="setting-colorterm">
            <option value="truecolor">truecolor</option>
            <option value="24bit">24bit</option>
            <option value="">无</option>
          </select>
        </label>
        <label><span data-i18n="autoFit">自动适应窗口</span> <input id="setting-auto-fit" type="checkbox" onchange="toggleFixedSizeFields()"></label>
        <div id="fixed-size-fields">
          <label><span data-i18n="termCols">列数</span> <input id="setting-term-cols" type="number" min="20" max="500" step="1"></label>
          <label><span data-i18n="termRows">行数</span> <input id="setting-term-rows" type="number" min="5" max="100" step="1"></label>
        </div>
        <div class="hint" data-i18n="sessionHint">对已有会话不生效，只影响新建会话</div>
      </div>

      <div class="modal-actions">
        <button class="secondary" onclick="resetSettings()" data-i18n="reset">重置</button>
        <button class="secondary" onclick="closeSettings()" data-i18n="cancel">取消</button>
        <button onclick="applySettings()" data-i18n="apply">应用</button>
      </div>
    </div>
  </div>

  <script src="/static/xterm.min.js"></script>
  <script src="/static/addon-fit.min.js"></script>
  <script src="/static/addon-search.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
